<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="#top" aria-label="Tianze Yang home"><span class="brand-mark" aria-hidden="true">TY</span><span>{{ site.title }}</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      {% for link in site.data.navigation.main %}<a href="{{ link.url }}">{{ link.title }}</a>{% endfor %}
    </nav>
    <a class="header-contact" href="mailto:{{ site.author.email }}">Let's connect <span aria-hidden="true">↗</span></a>
  </div>
</header>
