<script>
(() => {
  const total = document.getElementById('total_cit');
  const papers = document.querySelectorAll('.show_paper_citations');
  if (!total && !papers.length) return;
  {% if site.google_scholar_stats_use_cdn %}
  const base = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
  {% else %}
  const base = 'https://raw.githubusercontent.com/{{ site.repository }}/';
  {% endif %}
  fetch(base + 'google-scholar-stats/gs_data.json')
    .then(response => { if (!response.ok) throw new Error('Citation data unavailable'); return response.json(); })
    .then(data => {
      if (total && data.citedby != null) total.textContent = data.citedby;
      papers.forEach(element => {
        const paper = data.publications && data.publications[element.getAttribute('data')];
        if (paper && paper.num_citations != null) element.textContent = '| Citations: ' + paper.num_citations;
      });
    }).catch(() => {});
})();
</script>
